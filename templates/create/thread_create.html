{% extends "base.html" %}

{% block content %}

<main class="createpage">
    <form action="/add_thread" method="POST">
        <input type="text" name="title" placeholder="thread title" required>
        <textarea name="content" placeholder="write your thread..." required></textarea>
        <input type="hidden" name="topicid" value="{{ topicid }}">
        <input type="submit" value="create thread">
    </form>
</main>

{% endblock %}
