{% extends "base.html" %}

{% block content %}

<main>
<div id="thread">
<h1>{{ thread[0] }}</h1>
<small>{{ thread[2] }} - {{ thread[3] }}</small>
<hr>
<p>{{ thread[1] }}</p>
</div>

<div id="posts">
    <h2>Posts</h2>

    {% for post in posts %}
        <hr>
        <h3>{{ post[0] }}</h3>
        <small>{{ post[2] }}</small>
        <p>{{ post[1] }}</p>
        <hr>
    {% else %}
        <p>No posts.</p>
    {% endfor %}
</div>

<div id="add-post">
    <h2>Add a post</h2>

    <form action="/add_post" method="POST">
        <input type="hidden" name="threadid" value="{{ thread[4] }}">

        <textarea name="content" placeholder="..." required></textarea>

        <button type="submit">Submit post</button>
    </form>
</div>


</main>

{% endblock %}
