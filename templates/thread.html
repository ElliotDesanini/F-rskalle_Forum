{% extends "base.html" %}

{% block content %}

<main>
    <div id="thread">
        <h1>{{ thread[0] }}</h1>
        <small><p>{{thread[2]}} - {{ thread[3] }}</p></small>
        <hr>
        <p>{{ thread[1] }}</p>
    </div>
    <div id="posts">
        <ul>
            {%for post in posts%}
            <hr>
            <h3>{{ post[0] }}</h3>
            <small>{{ post[2] }}</small>
            <p>{{ post[1]}} </p>
            <hr>
            {% endfor %}
        </ul>
    </div>
</main>

{% endblock %}
