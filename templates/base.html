<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/fårskalle_logo.png') }}">
    <title>Fårskalle forum</title>
</head>

<body>

<nav>
    <div><img src="{{ url_for('static', filename='images/fårskalle_logo.png') }}" alt=""><a href="/">forum</a></div>

    <div>
        {% if session.get("userid") %}
            <a href="/user">{{ username }}</a>
            <form action="/logout" method="POST">
                <button type="submit">logout</button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">login</a>
            <a href="{{ url_for('register') }}">register</a>
        {% endif %}
    </div>
</nav>

{% block content %}
{% endblock content %}

</body>
</html>
