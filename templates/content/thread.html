{% extends "base.html" %}

{% block content %}

<main id="threadpage">
<div id="thread">
<h1>{{ thread[0] }}</h1>
<small>{{ thread[2] }} - {{ thread[3] }}</small>
<p>{{ thread[1] }}</p>
</div>

<div id="posts">
    {% for post in posts %}
        <hr>
        <h4>{{ post[0] }}</h4>
        <small>{{ post[2] }}</small>
        <p>{{ post[1] }}</p>
    {% else %}
    <hr>
        <p>No posts</p>
    <hr>
    {% endfor %}
</div>

<div id="add-post">
    <form action="/add_post" method="POST">
        <input type="hidden" name="threadid" value="{{ thread[4] }}">

        <input type="text" name="content" placeholder="write a post..." required>

        <button type="submit">Submit post</button>
    </form>
</div>


</main>

{% endblock %}
